name: Portfolio design checks
on:
  push:
    branches: [codex/portfolio-3d-refresh]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Install browser checks
        run: |
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps chromium
      - name: Desktop and mobile browser checks
        run: |
          npm run dev -- --host 127.0.0.1 --port 3000 > /tmp/portfolio-vite.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000 > /dev/null; then break; fi
            sleep 1
          done
          node scripts/check-design.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-design-checks
          path: design-checks
